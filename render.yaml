# Render Blueprint – Casino-Bonus- & Umsatz-Analytiker
# Web-Service = Rechner-Dashboard (funktioniert ohne Secrets) + optionaler Telegram-Webhook.
# Fuer reinen Polling-Betrieb stattdessen einen Worker mit startCommand "python main.py" nutzen.
version: "1"
services:
  - type: web
    name: casino-bonus-analytiker
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.dashboard:app --host 0.0.0.0 --port $PORT
    autoDeployTrigger: commit
    envVars:
      # Optional – nur setzen, wenn der Telegram-Webhook aktiv sein soll.
      - key: TELEGRAM_TOKEN
        sync: false
      # Optional – aktiviert die KI-gestuetzte AGB-Analyse.
      - key: DEEPSEEK_API_KEY
        sync: false
