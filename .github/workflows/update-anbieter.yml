name: Anbieter-Profile taeglich aktualisieren (GGL-Whitelist, Rahmen, Studios)

# Ruft die oeffentliche GGL-Whitelist (eine Seite, identifizierbarer User-Agent) ab und
# aktualisiert den Block "whitelist" je Anbieter, den gesetzlichen Rahmen (GGL-Seiten) und die
# Jackpotpiraten-Studio-Tabelle in docs/anbieter.json. Weitere Betreiberseiten sind nicht lesbar.
# Faellt der Abruf aus oder aendert sich das Seitenformat, bleibt die Datei unveraendert.
# Committet nur bei echter inhaltlicher Aenderung (reine Abrufzeit zaehlt nicht).

on:
  schedule:
    - cron: "7 5 * * *"        # taeglich 05:07 UTC (nach dem Spiele-Job um 04:17)
  workflow_dispatch: {}

permissions:
  contents: write              # Least-Privilege: nur Commit von docs/anbieter.json

concurrency:
  group: update-anbieter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        run: python -m unittest discover -s tests

      - name: Whitelist abgleichen
        run: python -m datenbank.anbieter_whitelist

      - name: Gesetzlichen Rahmen (GGL) + Jackpotpiraten-Studios lesen
        run: python -m datenbank.anbieter_details

      - name: JSON validieren
        run: python -c "import json; d=json.load(open('docs/anbieter.json')); assert d['anbieter'], 'leer'; print('anbieter.json valide:', sorted(d['anbieter']))"

      - name: Bei echter Aenderung committen
        run: |
          if git diff --quiet -- docs/anbieter.json; then
            echo "Keine inhaltliche Aenderung – nichts zu committen."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/anbieter.json
          git commit -m "chore(data): Anbieter-Whitelist-Abgleich docs/anbieter.json"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
