name: Spiele-Datenbank taeglich aktualisieren

# Erzeugt docs/games.json aus dem oeffentlichen Basissatz + optionalen
# oeffentlichen JSON-Feeds (Repo-Variable GAMES_SOURCES, kommagetrennte URLs).
# Laeuft serverseitig -> keine CORS-Schranke. Committet nur bei echter Aenderung.

on:
  schedule:
    - cron: "17 4 * * *"      # taeglich 04:17 UTC
  workflow_dispatch: {}        # manuell ausloesbar

permissions:
  contents: write

concurrency:
  group: update-games
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: games.json neu erzeugen
        env:
          GAMES_SOURCES: ${{ vars.GAMES_SOURCES }}
        run: python -m datenbank

      - name: Bei Aenderung committen
        run: |
          if [ -n "$(git status --porcelain docs/games.json)" ]; then
            git config user.name  "codex2050-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/games.json
            git commit -m "chore(data): taegliche Aktualisierung docs/games.json"
            git push
            echo "games.json aktualisiert und gepusht."
          else
            echo "Keine inhaltliche Aenderung – nichts zu committen."
          fi
